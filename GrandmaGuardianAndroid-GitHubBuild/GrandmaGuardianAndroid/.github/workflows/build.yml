name: Build Grandma Guardian APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "GrandmaGuardianAndroid-GitHubBuild/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: gradle -p "$GITHUB_WORKSPACE/GrandmaGuardianAndroid-GitHubBuild" --settings-file "$GITHUB_WORKSPACE/GrandmaGuardianAndroid-GitHubBuild/settings.gradle" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grandma-Guardian-APK
          path: GrandmaGuardianAndroid-GitHubBuild/app/build/outputs/apk/debug/*.apk
