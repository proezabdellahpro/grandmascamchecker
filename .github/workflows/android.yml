
name: Build Grandma Guardian APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          
      
      - name: Build APK
        run: gradle -p "$GITHUB_WORKSPACE/GrandmaGuardianAndroid-GitHubBuild/GrandmaGuardianAndroid" assembleDebug



      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Grandma-Guardian-APK
          path: GrandmaGuardianAndroid-GitHubBuild/GrandmaGuardianAndroid/app/build/outputs/apk/debug/*.apk
